<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Talysson Decol — Software, Inteligência Artificial e Segurança</title>
  <desc id="desc">Banner escuro com detalhes em roxo e ciano, nome Talysson Decol e ilustração de terminal de programação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset=".62" stop-color="#11152b"/>
      <stop offset="1" stop-color="#191235"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56e0e8"/>
      <stop offset=".5" stop-color="#9b8cff"/>
      <stop offset="1" stop-color="#d2a5ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7d6bfa" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7d6bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#b7bdff" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="18" fill="url(#grid)"/>
  <circle cx="1010" cy="150" r="295" fill="url(#glow)"/>
  <path d="M0 0 H1200" stroke="url(#accent)" stroke-width="4"/>
  <path d="M55 61 H89" stroke="#56e0e8" stroke-width="4" stroke-linecap="round"/>
  <text x="105" y="67" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3.2" fill="#93a2cb">DEVELOPER  /  RESEARCHER  /  BUILDER</text>
  <text x="56" y="162" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="800" letter-spacing="-2" fill="#ffffff">Talysson Decol</text>
  <rect x="58" y="188" width="58" height="5" rx="2.5" fill="#56e0e8"/>
  <rect x="123" y="188" width="22" height="5" rx="2.5" fill="#9b8cff"/>
  <text x="57" y="228" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#d5ddf8">Software  ·  Inteligência Artificial  ·  Segurança</text>
  <text x="57" y="267" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a4b0d3">Transformando ideias em soluções bem construídas.</text>
  <g transform="translate(847 52)">
    <rect width="301" height="227" rx="17" fill="#131b34" stroke="#66689c" stroke-opacity=".65" stroke-width="1.5"/>
    <path d="M0 39 H301" stroke="#545a87" stroke-opacity=".65"/>
    <circle cx="22" cy="20" r="5" fill="#f0838f"/>
    <circle cx="41" cy="20" r="5" fill="#f6c778"/>
    <circle cx="60" cy="20" r="5" fill="#65d9c6"/>
    <text x="152" y="25" text-anchor="middle" font-family="monospace" font-size="12" fill="#9aa6cc">~/talysson/projects</text>
    <text x="22" y="76" font-family="monospace" font-size="15" fill="#6ce1dd">&gt; const focus = {</text>
    <text x="41" y="109" font-family="monospace" font-size="15" fill="#d9d3ff">ai: <tspan fill="#a6e3b9">true</tspan>,</text>
    <text x="41" y="142" font-family="monospace" font-size="15" fill="#d9d3ff">security: <tspan fill="#a6e3b9">true</tspan>,</text>
    <text x="41" y="175" font-family="monospace" font-size="15" fill="#d9d3ff">curiosity: <tspan fill="#a6e3b9">Infinity</tspan></text>
    <text x="22" y="207" font-family="monospace" font-size="15" fill="#6ce1dd">};</text>
  </g>
  <path d="M792 59 l16 16 -16 16" fill="none" stroke="#8b83ff" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M792 247 l16 16 -16 16" fill="none" stroke="#56e0e8" stroke-opacity=".45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
